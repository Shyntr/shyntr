        "400":
          description: Invalid logout request or missing issuer
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Signature verification failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: SAML IdP Single Logout
