  /t/{tenant_id}/oidc/callback:
    get:
      description: Handles the callback from an external OIDC Identity Provider. Validates
        state and CSRF, exchanges the authorization code for tokens, fetches UserInfo,
        maps attributes, and resumes the original login flow.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Authorization code returned by the external IdP
        in: query
        name: code
        required: true
        type: string
      - description: State parameter to mitigate CSRF and restore context
        in: query
        name: state
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirects back to the original protocol handler (SAML or OAuth2)
            with a login_verifier
          schema:
            type: string
        "400":
          description: Bad Request (invalid or missing callback parameters)
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden (CSRF validation failed, invalid state, or session
            expired)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error (connection not found or mapping failed)
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: OIDC Federation Callback
      tags:
      - OIDC Federation
  /t/{tenant_id}/oidc/login/{connection_id}:
    get:
      description: Starts the login flow with an external OIDC Identity Provider (e.g.,
        Google, Okta) for a specific tenant and connection. Generates CSRF tokens
        and redirects the user.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: OIDC Connection ID
        in: path
        name: connection_id
        required: true
        type: string
      - description: The active cryptographic login challenge ID
        in: query
        name: login_challenge
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirects the user agent to the external Identity Provider's
            authorization endpoint
          schema:
            type: string
        "400":
          description: Bad Request (missing tenant_id or login_challenge)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found (login request not found)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error (failed to initiate OIDC)
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initiate OIDC Federation Login
