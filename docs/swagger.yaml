        description: |-
          NameFormat overrides the SAML attribute NameFormat for the emitted
          attribute. Empty means "unset": the emission site derives it from the
          output attribute name. Validated against the SAML 2.0 attrname-format set.
        example: urn:oasis:names:tc:SAML:2.0:attrname-format:uri
        type: string
      source:
        type: string
      target:
        type: string
      target_scopes:
        items:
          type: string
        type: array
      type:
        type: string
      value:
        type: string
    type: object
  model.AuthActivity:
