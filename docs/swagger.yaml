      - description: Base64 encoded AuthnRequest (HTTP-POST)
        in: formData
        name: SAMLRequest
        type: string
      - description: Opaque state passed back to the SP
        in: query
        name: RelayState
        type: string
      - description: Internal verifier after a successful login challenge
        in: query
        name: login_verifier
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML form auto-posting the SAMLResponse to the SP
          schema:
            type: string
        "302":
          description: Redirects to login UI if unauthenticated
          schema:
            type: string
        "400":
          description: Invalid SAMLRequest or Login Verifier
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Unknown Service Provider
