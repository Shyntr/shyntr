      description: Receives an AuthnRequest from a Service Provider. Challenges the
        user for authentication and issues a SAMLResponse containing assertions.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Deflated and Base64 encoded AuthnRequest (HTTP-Redirect)
