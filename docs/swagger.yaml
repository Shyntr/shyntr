info:
  contact: {}
  description: Protocol Agnostic Zero Trust Identity Broker
  title: Shyntr Identity Hub API
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      description: Returns the public keys used by the Authorization Server to sign
        JWTs (like ID Tokens). Used by clients to verify signatures.
      produces:
      - application/json
      responses:
        "200":
          description: The JWKS document containing an array of keys
          schema:
            additionalProperties: true
            type: object
      summary: JSON Web Key Set (JWKS) Endpoint
      tags:
      - OAuth2/OIDC Core
  /.well-known/openid-configuration:
    get:
      description: Returns the OIDC Provider Configuration Document. Details the supported
        scopes, claims, and endpoints for a specific tenant.
      produces:
      - application/json
      responses:
        "200":
          description: The OIDC discovery metadata document
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Tenant not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OpenID Connect Discovery Endpoint
      tags:
      - OAuth2/OIDC Core
  /admin/consent:
    get:
      description: Retrieves the details of an active OAuth2 consent challenge, including
        requested scopes and client tenant context.
      parameters:
      - description: The cryptographic consent challenge ID
        in: query
        name: consent_challenge
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns consent request details along with client and tenant
            information
          schema:
            additionalProperties: true
            type: object
        "400":
          description: consent_challenge is required
          schema:
            $ref: '#/definitions/payload.AppError'
        "404":
          description: Consent request not found
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to fetch client details
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Get OAuth2 Consent Request
      tags:
      - Auth-Admin
  /admin/consent/accept:
    put:
      consumes:
      - application/json
      description: Accepts a consent request, granting the requested scopes and audiences
        to the OAuth2 client.
      parameters:
      - description: The cryptographic consent challenge ID
        in: query
        name: consent_challenge
        required: true
        type: string
      - description: Consent acceptance payload with granted scopes/audiences
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.AcceptConsentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns redirect_to URL containing the consent verifier
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or missing challenge
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to accept consent request
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Accept OAuth2 Consent Request
      tags:
      - Auth-Admin
  /admin/consent/reject:
    put:
      consumes:
      - application/json
      description: Rejects a consent request (e.g., user denied access to scopes)
        and aborts the OAuth2 flow.
      parameters:
      - description: The cryptographic consent challenge ID
        in: query
        name: consent_challenge
        required: true
        type: string
      - description: Rejection payload containing error code and description
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.RejectRequestPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Returns redirect_to URL containing error details
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or missing challenge
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to reject consent request
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Reject OAuth2 Consent Request
      tags:
      - Auth-Admin
  /admin/login:
    get:
      description: Retrieves the details of an active OAuth2 login challenge. Acts
        as an internal IdP trust boundary.
      parameters:
      - description: The cryptographic login challenge ID
        in: query
        name: login_challenge
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns the login request details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: login_challenge is required
          schema:
            $ref: '#/definitions/payload.AppError'
        "404":
          description: Login request not found
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Get OAuth2 Login Request
      tags:
      - Auth-Admin
  /admin/login/accept:
    put:
      consumes:
      - application/json
      description: Accepts a login request and confirms the user's identity. Returns
        a redirection URL to continue the OAuth2 flow.
      parameters:
      - description: The cryptographic login challenge ID
        in: query
        name: login_challenge
        required: true
        type: string
      - description: Login acceptance payload containing subject and session preferences
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.AcceptLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns redirect_to URL containing the login verifier
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or missing challenge
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to accept login request
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Accept OAuth2 Login Request
      tags:
      - Auth-Admin
  /admin/login/reject:
    put:
      consumes:
      - application/json
      description: Rejects a login request (e.g., due to invalid credentials or user
        denial) and aborts the OAuth2 flow.
      parameters:
      - description: The cryptographic login challenge ID
        in: query
        name: login_challenge
        required: true
        type: string
      - description: Rejection payload containing error code and description
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.RejectRequestPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Returns redirect_to URL containing error details
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or missing challenge
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to reject login request
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Reject OAuth2 Login Request
      tags:
      - Auth-Admin
  /admin/management/clients:
    get:
      description: Lists all OAuth2/OIDC clients across the system. Secrets are masked.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OAuth2Client'
            type: array
        "500":
          description: Failed to retrieve clients
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: List All OIDC Clients
      tags:
      - OAuth2 Clients
    post:
      consumes:
      - application/json
      description: Registers a new OAuth2/OIDC client under the specified tenant enforcing
        OAuth 2.1 standards.
      parameters:
      - description: Client Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.CreateOAuth2ClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payload.CreateOAuth2ClientRequest'
        "400":
          description: Invalid request payload or tenant not found
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to create OIDC req
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Create OIDC Client
      tags:
      - OAuth2 Clients
  /admin/management/clients/{id}:
    put:
      consumes:
      - application/json
      description: Updates an existing OAuth2/OIDC client. Pass "*****" or empty string
        to keep the existing secret.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Client Update Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.CreateOAuth2ClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: updated'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/payload.AppError'
        "404":
          description: OIDC Client not found
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to update OIDC client
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Update OIDC Client
      tags:
      - OAuth2 Clients
  /admin/management/clients/{tenant_id}/{id}:
    delete:
      description: Deletes an OAuth2/OIDC client from a specific tenant.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Failed to delete OIDC client
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: DeleteByClient OIDC Client
      tags:
      - OAuth2 Clients
    get:
      description: Retrieves details of a specific OAuth2/OIDC client. Secrets are
        masked.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OAuth2Client'
        "404":
          description: OIDC Client not found
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Get OIDC Client
      tags:
      - OAuth2 Clients
  /admin/management/dashboard/auth-activity:
    get:
      description: Retrieves real-time authentication success and failure counts by
        protocol for a given time range across all tenants.
      parameters:
      - description: Time range (1h, 24h, 7d)
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthActivity'
      security:
      - BearerAuth: []
      summary: Get Authentication Activity
      tags:
      - Dashboard
  /admin/management/dashboard/auth-failures:
    get:
      description: Retrieves failure intelligence and breakdown by reason and protocol
        across all tenants.
      parameters:
      - description: Time range (1h, 24h, 7d)
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthFailures'
      security:
      - BearerAuth: []
      summary: Get Authentication Failures
      tags:
      - Dashboard
  /admin/management/dashboard/health-summary:
    get:
      description: Retrieves a high-level health summary of critical system components
        (database, keys, migrations).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthSummary'
      security:
      - BearerAuth: []
      summary: Get Dashboard Health Summary
      tags:
      - Dashboard
  /admin/management/dashboard/routing-insights:
    get:
      description: Retrieves patterns of protocol transitions (e.g., OIDC -> SAML)
        across all authentication flows.
      parameters:
      - description: Time range (1h, 24h, 7d)
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RoutingInsights'
      security:
      - BearerAuth: []
      summary: Get Protocol Routing Insights
      tags:
      - Dashboard
  /admin/management/dashboard/stats:
    get:
      description: Retrieves global or tenant-specific usage statistics and active
        connection counts.
      parameters:
      - description: Tenant ID (for filtering)
        in: query
        name: tenant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns system statistics and recent activity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Dashboard Statistics
      tags:
      - Dashboard
  /admin/management/ldap-connections:
    get:
      description: Lists all federated LDAP Identity Providers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/payload.LDAPConnectionResponse'
            type: array
        "500":
          description: Failed to retrieve LDAP connections
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: List All LDAP Connections
      tags:
      - LDAP Connections
    post:
      consumes:
      - application/json
      description: Registers an external LDAP/Active-Directory Identity Provider for
        federated authentication.
      parameters:
      - description: LDAP Connection Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.CreateLDAPConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payload.LDAPConnectionResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to create LDAP connection
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Create LDAP Connection (IdP)
      tags:
      - LDAP Connections
  /admin/management/ldap-connections/{tenant_id}/{id}:
    delete:
      description: Deletes a federated LDAP Identity Provider from a tenant.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Connection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Failed to delete LDAP connection
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Delete LDAP Connection
      tags:
      - LDAP Connections
    get:
      description: Retrieves details of a specific LDAP Identity Provider. BindPassword
        is never returned.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Connection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.LDAPConnectionResponse'
        "404":
          description: LDAP Connection not found
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Get LDAP Connection
      tags:
      - LDAP Connections
    put:
      consumes:
      - application/json
      description: Updates an existing LDAP Identity Provider. Pass empty string or
        "*****" for bind_password to keep the existing value.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Connection ID
        in: path
        name: id
        required: true
        type: string
      - description: LDAP Connection Update Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.CreateLDAPConnectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: updated'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/payload.AppError'
        "403":
          description: Connection does not belong to this tenant
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to update LDAP connection
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Update LDAP Connection
      tags:
      - LDAP Connections
  /admin/management/ldap-connections/{tenant_id}/{id}/test:
    post:
      description: Verifies connectivity and service-account bind credentials for
        an LDAP connection.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Connection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Connection test failed
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Test LDAP Connection
      tags:
      - LDAP Connections
  /admin/management/oidc-connections:
    get:
      description: Lists all federated OIDC Identity Providers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OIDCConnection'
            type: array
        "500":
          description: Failed to retrieve OIDC connections
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: List All OIDC Connections
      tags:
      - OIDC Connections
    post:
      consumes:
      - application/json
      description: Registers an external OpenID Connect Identity Provider for federated
        authentication.
      parameters:
      - description: OIDC Connection Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.CreateOIDCConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payload.CreateOIDCConnectionRequest'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to create OIDC connection
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
      summary: Create OIDC Connection (IdP)
      tags:
      - OIDC Connections
  /admin/management/oidc-connections/{id}:
    put:
      consumes:
      - application/json
      description: Updates an existing OIDC Identity Provider.
      parameters:
      - description: Connection ID
        in: path
        name: id
        required: true
        type: string
      - description: OIDC Connection Update Configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payload.CreateOIDCConnectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: updated'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/payload.AppError'
        "500":
          description: Failed to update OIDC connection
          schema:
            $ref: '#/definitions/payload.AppError'
      security:
      - BearerAuth: []
