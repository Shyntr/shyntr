  /audit/{tenant_id}:
    get:
      description: Retrieves paginated audit logs for a specific tenant.
      parameters:
      - description: Tenant ID for isolation boundary
        in: path
        name: tenant_id
        required: true
        type: string
      - default: 100
        description: Number of records to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of records to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of tenant audit logs
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: error - Failed to get audit logs
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Tenant Audit Logs
      tags:
      - Audit
  /auth/methods:
    get:
      description: Retrieves available identity providers and authentication methods
        for a given cryptographic login challenge. This discovery endpoint establishes
        the initial context for the user authentication journey.
      parameters:
      - description: The cryptographic login challenge ID
        in: query
        name: login_challenge
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns the challenge ID, tenant ID, and a list of available
            login methods
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing_login_challenge or invalid challenge
          schema:
            $ref: '#/definitions/payload.AppError'
      summary: Get Login Methods
      tags:
      - Auth-Login
  /health:
    get:
      description: Evaluates the health of the Shyntr service and its underlying database
        connection. This is a public endpoint used for observability and orchestration
        readiness probes.
      produces:
      - application/json
      responses:
        "200":
          description: Returns service and database connection status
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - Health
  /oauth2/auth:
    get:
      description: Handles the initial step of the OAuth 2.1 authorization code flow.
        Enforces PKCE, tenant boundaries, and redirects the user agent to the login
        or consent UI.
      parameters:
      - description: OAuth2 Client ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: Registered redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Requested space-separated scopes
        in: query
        name: scope
        type: string
      - description: Opaque value used to maintain state between the request and the
          callback
        in: query
        name: state
        type: string
      - description: PKCE code challenge (Required if client enforces PKCE)
        in: query
        name: code_challenge
        type: string
      - description: PKCE method, e.g., 'S256'
        in: query
        name: code_challenge_method
        type: string
      - description: Forces login or consent (e.g., 'login', 'consent', 'none')
        in: query
        name: prompt
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirects to login UI, consent UI, or the client's redirect
            URI with an authorization code
          schema:
            type: string
        "400":
          description: Bad Request (e.g., missing PKCE, invalid redirect URI)
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden (e.g., client not found in tenant)
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OAuth2 Authorization Endpoint
      tags:
      - OAuth2/OIDC Core
  /oauth2/introspect:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Allows a protected resource (e.g., an API gateway) to query the
        active state and metadata of a given token.
      parameters:
      - description: The token to introspect
        in: formData
        name: token
        required: true
        type: string
      - description: OAuth2 Client ID
        in: formData
        name: client_id
        type: string
      - description: OAuth2 Client Secret
        in: formData
        name: client_secret
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Introspection response (active boolean and token metadata)
          schema:
            additionalProperties: true
            type: object
      summary: Token Introspection Endpoint (RFC 7662)
      tags:
      - OAuth2/OIDC Core
  /oauth2/logout:
    get:
      description: Terminates the user's session. Supports id_token_hint for validation
        and post_logout_redirect_uri for safe redirection. Also propagates logout
        to federated IdPs if applicable.
      parameters:
      - description: Previously issued ID Token to validate the logout request
        in: query
        name: id_token_hint
        type: string
      - description: Registered URI to redirect after successful logout
        in: query
        name: post_logout_redirect_uri
        type: string
      - description: Opaque value to maintain state
        in: query
        name: state
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Returns a success message if no redirect URI is provided
          schema:
            additionalProperties:
              type: string
            type: object
        "302":
          description: Redirects to post_logout_redirect_uri
          schema:
            type: string
      summary: OpenID Connect RP-Initiated Logout
      tags:
      - OAuth2/OIDC Core
  /oauth2/revoke:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Allows clients to notify the authorization server that a previously
        obtained refresh or access token is no longer needed.
      parameters:
      - description: The token to revoke
        in: formData
        name: token
        required: true
        type: string
      - description: Hint about the token type (e.g., 'refresh_token' or 'access_token')
        in: formData
        name: token_type_hint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Empty response on successful revocation (or if token didn't
            exist)
      summary: Token Revocation Endpoint (RFC 7009)
      tags:
      - OAuth2/OIDC Core
  /oauth2/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Issues access tokens, ID tokens, and refresh tokens based on the
        provided grant type (e.g., authorization_code, client_credentials, refresh_token).
        Enforces tenant isolation.
      parameters:
      - description: Grant Type (e.g., 'authorization_code', 'client_credentials')
        in: formData
        name: grant_type
        required: true
        type: string
      - description: OAuth2 Client ID
        in: formData
        name: client_id
        type: string
      - description: OAuth2 Client Secret (for basic/post auth)
        in: formData
        name: client_secret
        type: string
      - description: Authorization code (if grant_type=authorization_code)
        in: formData
        name: code
        type: string
      - description: Registered redirect URI (must match the one in the auth request)
        in: formData
        name: redirect_uri
        type: string
      - description: PKCE code verifier (if PKCE was used)
        in: formData
        name: code_verifier
        type: string
      - description: Refresh token (if grant_type=refresh_token)
        in: formData
        name: refresh_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns access_token, id_token, refresh_token, and expires_in
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request (e.g., invalid grant, invalid client)
          schema:
            additionalProperties: true
            type: object
      summary: OAuth2 Token Endpoint
      tags:
      - OAuth2/OIDC Core
  /t/{tenant_id}/.well-known/jwks.json:
    get:
      description: Returns the public keys used by the Authorization Server to sign
        JWTs (like ID Tokens). Used by clients to verify signatures.
      produces:
      - application/json
      responses:
        "200":
          description: The JWKS document containing an array of keys
          schema:
            additionalProperties: true
            type: object
      summary: JSON Web Key Set (JWKS) Endpoint
      tags:
      - OAuth2/OIDC Core
  /t/{tenant_id}/.well-known/openid-configuration:
    get:
      description: Returns the OIDC Provider Configuration Document. Details the supported
        scopes, claims, and endpoints for a specific tenant.
      produces:
      - application/json
      responses:
        "200":
          description: The OIDC discovery metadata document
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Tenant not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OpenID Connect Discovery Endpoint
      tags:
      - OAuth2/OIDC Core
  /t/{tenant_id}/ldap/login/{connection_id}:
    post:
      consumes:
      - application/json
      description: Authenticates a user against an LDAP/Active-Directory Identity
        Provider and completes the login challenge.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: LDAP Connection ID
        in: path
        name: connection_id
        required: true
        type: string
      - description: Login credentials and challenge
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ldapLoginRequest'
      produces:
      - text/html
      responses:
        "302":
          description: Redirects back to the relying party with a login_verifier
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized (invalid credentials or user not found)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Login request not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: LDAP Username/Password Login
      tags:
      - LDAP Federation
