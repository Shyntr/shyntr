  /t/{tenant_id}/saml/sp/acs:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives and validates the SAMLResponse from an external Identity
        Provider. Prevents XML Signature Wrapping (XSW) and CSRF attacks.
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Base64 encoded SAML Response
        in: formData
        name: SAMLResponse
        required: true
        type: string
      - description: Relay state containing the login challenge
        in: formData
        name: RelayState
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirects back to the originating protocol flow (OIDC or SAML)
